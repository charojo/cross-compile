name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enable arm64 packages
        run: |
          sudo dpkg --add-architecture arm64
          sudo tee /etc/apt/sources.list.d/arm64.list >/dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe multiverse restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe multiverse restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main universe multiverse restricted
          EOF
          sudo rm -rf /var/lib/apt/lists/*
          if ! sudo apt-get update -o Acquire::Retries=3; then
            sed -e 's@http://.*.ubuntu.com@http://azure.archive.ubuntu.com@' \
                /etc/apt/sources.list | sudo tee /etc/apt/sources.list
            sudo apt-get update
          fi
      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            curl cmake libprotobuf-dev protobuf-compiler \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu python3-pip clang-format \
            libzmq3-dev libsqlite3-dev pkg-config \
            libzmq3-dev:arm64 libsqlite3-dev:arm64 \
            qemu-user qemu-user-static qemu-system-aarch64
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add aarch64-unknown-linux-gnu
          rustup component add clippy rustfmt
          pip install pytest pytest-cov pre-commit pyzmq protobuf behave
      - name: Pre-commit
        run: pre-commit run --all-files
      - name: Build
        run: |
          make build
          test -f build/cpp-service/libsensor_service.so
      - name: Unit tests
        run: make test 2>&1 | tee tests/TEST_REPORT.md
      - name: BDD scenarios
        run: |
          if [ -d features ]; then
            behave
          else
            echo "No BDD features found"
          fi
      - name: Coverage
        id: coverage
        run: |
          pytest tests --cov=python_worker --cov-report=xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tests/TEST_REPORT.md
      - name: Upload coverage report
        if: always() && steps.coverage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
