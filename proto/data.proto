syntax = "proto3";

message GetUserRequest {
  int32 user_id = 1;
  string field = 2;
}

message UpdateUserRequest {
  int32 user_id = 1;
  string field = 2;
  string value = 3;
}

message UpdateUserResponse {
  bool success = 1;
  string message = 2;
}

message UpdateUserEvent {
  int32 user_id = 1;
  string field = 2;
  string old_value = 3;
  string new_value = 4;
}

message GetUserResponse {
  bool found = 1;
  string value = 2;
}

message SensorReading {
  int32 sensor_id = 1;
  double value = 2;
  int64 timestamp = 3;
}

message ControlCommand {
  uint64 new_rate = 1;
  string target = 2;
  string command = 3;
}
