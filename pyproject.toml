[project]
name = "cross-compile"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["proto", "python_worker"]

[tool.setuptools.package-dir]
proto = "proto"
python_worker = "python-worker"

[tool.black]
line-length = 88
